services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sybeez
      POSTGRES_PASSWORD: sybeez
      POSTGRES_DB: sybeez
    ports:
      - "5432:5432"
    volumes:
      - ai_pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sybeez:sybeez@postgres:5432/sybeez
      REDIS_URL: redis://redis:6379/0
      CORE_API_URL: http://host.docker.internal:8000
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/ai:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ai_pg:
