[project]
name = "sybeez-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.28.0",
  "pgvector>=0.3.6",
  "sse-starlette>=2.1.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.17",
  "boto3>=1.35.0",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.28.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
